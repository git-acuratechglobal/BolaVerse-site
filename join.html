  :root {
    --bg: #010a09;
    --bg-soft: #05110d;
    --bg-card: rgba(255,255,255,0.035);
    --border: rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.16);
    --text: #ffffff;
    --text-dim: #a9b6b4;
    --text-dimmer: #647471;
    --lime: #a3e34d;
    --teal: #2dd4be;
    --ink: #01130d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: 'Switzer', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 28px 20px; text-align: center; position: relative; overflow-x: hidden;
  }
  body::before {
    content: ''; position: absolute; inset: -10% -10% auto -10%; height: 480px; z-index: -1;
    background:
      radial-gradient(520px 380px at 20% 0%, rgba(15,111,232,0.22), transparent 60%),
      radial-gradient(560px 420px at 85% 10%, rgba(163,227,77,0.18), transparent 60%),
      radial-gradient(700px 400px at 50% -10%, rgba(45,212,190,0.12), transparent 65%);
    pointer-events: none;
  }

  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 28px; }
  .brand img { height: 44px; width: auto; }

  .card {
    max-width: 400px; width: 100%;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 24px;
    padding: 36px 28px 28px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--lime); font-size: 11.5px; font-weight: 700; letter-spacing: 1.4px;
    text-transform: uppercase; margin: 0 0 18px;
    padding: 6px 12px 6px 8px; border: 1px solid var(--border-strong); border-radius: 999px;
    background: rgba(163,227,77,0.06);
  }
  .eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 8px var(--lime); }

  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 10px; line-height: 1.15; }
  p.sub { color: var(--text-dim); font-size: 15px; line-height: 1.55; margin: 0 0 24px; }
  p.sub b { color: var(--text); }

  .code-wrap { margin: 0 0 26px; }
  .code-label { font-size: 11px; color: var(--text-dimmer); letter-spacing: 1px; text-transform: uppercase; margin: 0 0 10px; }
  .code-btn {
    all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 16px 18px; border-radius: 14px;
    background: rgba(255,255,255,.04); border: 1px dashed var(--border-strong);
    font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; letter-spacing: 7px; color: var(--text);
    transition: border-color .15s ease, background .15s ease;
  }
  .code-btn:hover, .code-btn:focus-visible { border-color: var(--lime); border-style: solid; background: rgba(163,227,77,0.06); }
  .code-btn svg { flex: none; opacity: 0.55; width: 15px; height: 15px; }

  @media (max-width: 340px) {
    .card { padding-left: 20px; padding-right: 20px; }
    .code-btn { padding: 14px 10px; font-size: 20px; letter-spacing: 4px; }
  }
  .copy-hint { font-size: 11.5px; color: var(--text-dimmer); margin: 8px 0 0; transition: color .15s ease; }
  .copy-hint.copied { color: var(--lime); }

  .lp-store-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px; }
  .lp-store-btn {
    display: flex; align-items: center; gap: 12px; justify-content: center;
    border: 1px solid var(--border-strong); border-radius: 14px; padding: 13px 20px;
    text-decoration: none; color: var(--text); text-align: left;
    transition: border-color .2s ease, background .2s ease;
  }
  .lp-store-btn:hover { border-color: var(--lime); background: rgba(163,227,77,0.06); }
  .lp-store-eyebrow { font-size: 10px; color: var(--text-dimmer); display: block; }
  .lp-store-name { font-size: 14.5px; font-weight: 700; display: block; }

  .foot-note { margin-top: 26px; font-size: 12.5px; color: var(--text-dimmer); }
  .foot-note a { color: var(--text-dim); text-decoration: underline; text-underline-offset: 2px; }
</style>

  var code = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '').toUpperCase();

  document.getElementById('codeBtn').addEventListener('click', function () {

      setTimeout(function () {
        hint.textContent = 'Tap the code to copy it';
        hint.classList.remove('copied');
